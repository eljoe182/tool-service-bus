[project]
name = "tool-service-bus"
version = "0.1.0"
description = "Send enveloped JSON messages to Azure Service Bus queues"
authors = [
    { name = "Joise Garcia", email = "ec20@esmax.cl" }
]
requires-python = ">=3.11"
dependencies = [
    "azure-servicebus>=7.13,<8.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
service-bus-send = "sender.cli:main"
service-bus-read = "reader.cli:main"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [
    { include = "shared", from = "src" },
    { include = "sender", from = "src" },
    { include = "reader", from = "src" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
